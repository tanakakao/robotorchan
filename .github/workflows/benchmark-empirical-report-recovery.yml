name: Recover empirical report from saved trajectories

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: GitHub Actions run containing the original empirical artifact
        required: true
        type: string
        default: "44093235539"
      artifact_name:
        description: Exact original artifact name
        required: true
        type: string
        default: empirical-branin-q1-44093235539

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install package
        run: python -m pip install -e .
      - name: Download preserved source trajectories
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          mkdir empirical-cohort
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" --dir empirical-cohort
      - name: Validate original cohort and regenerate report
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_ARTIFACT: ${{ inputs.artifact_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from robotorchan.benchmarks.empirical_report import save_empirical_report

          root = Path("empirical-cohort")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          if manifest.get("status") != "runtime_validated":
              raise ValueError("Original cohort is not runtime-validated.")
          if manifest.get("dirty") is not False or not manifest.get("git_sha"):
              raise ValueError("Original source provenance is incomplete.")
          save_empirical_report(root, root / "report.json")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          if report["status"] != "complete" or report["git_sha"] != manifest["git_sha"]:
              raise ValueError("Report does not match the original cohort.")
          provenance = {
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "source_artifact": os.environ["SOURCE_ARTIFACT"],
              "original_git_sha": manifest["git_sha"],
              "report_code_git_sha": os.environ["GITHUB_SHA"],
          }
          (root / "report_provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          print("Recovered report from preserved trajectories without rerunning BO.")
          PY
      - name: Preserve report and source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: recovered-empirical-report-${{ github.run_id }}
          path: empirical-cohort/
          if-no-files-found: warn
          retention-days: 30
