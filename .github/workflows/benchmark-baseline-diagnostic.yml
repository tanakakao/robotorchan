name: Benchmark baseline diagnostic

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Benchmark problem
        type: choice
        options: [branin, hartmann6]
        default: branin
      q:
        description: Batch size
        type: choice
        options: ["1", "3"]
        default: "1"
  pull_request:
    paths:
      - "scripts/run_empirical_baseline_cohort.py"
      - ".github/workflows/benchmark-baseline-diagnostic.yml"

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install benchmark package
        run: python -m pip install -e .
      - name: Run two-seed Random/Sobol diagnostic
        env:
          BENCHMARK_PROBLEM: ${{ inputs.problem || 'branin' }}
          BENCHMARK_Q: ${{ inputs.q || '1' }}
          BENCHMARK_SHA: ${{ github.sha }}
        run: |
          python scripts/run_empirical_baseline_cohort.py \
            --problem "$BENCHMARK_PROBLEM" \
            --q "$BENCHMARK_Q" \
            --seeds 2 \
            --git-sha "$BENCHMARK_SHA" \
            --output benchmark-diagnostic
      - name: Verify diagnostic manifest and paired runtime rows
        if: success()
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("benchmark-diagnostic")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          with (root / "runtime_by_seed.csv").open(newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle))
          assert manifest["status"] == "measured", manifest
          assert manifest["tier"] == "diagnostic_two_seed", manifest
          assert manifest["seeds"] == [0, 1], manifest
          assert manifest["row_count"] == 4, manifest
          assert {(row["strategy"], int(row["seed"])) for row in rows} == {
              ("random", 0), ("random", 1), ("sobol", 0), ("sobol", 1)
          }, rows
          print("Diagnostic only: NOT a certified ten-seed empirical result.")
          PY
      - name: Preserve diagnostic evidence even on failure
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-two-seed-diagnostic
          path: benchmark-diagnostic/
          if-no-files-found: warn
          retention-days: 14
