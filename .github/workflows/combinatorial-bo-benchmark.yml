name: Combinatorial BO benchmark verification

on:
  pull_request:
    paths:
      - ".github/workflows/combinatorial-bo-benchmark.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Run real nine-method benchmark
        run: |
          set -o pipefail
          python -u examples/combinatorial_bo_benchmark.py \
            --seeds 2 --steps 2 --dimensions 3 --initial 3 \
            --output combinatorial_bo_results.csv 2>&1 | tee combinatorial_bo_benchmark.log
      - name: Save benchmark observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combinatorial-bo-results
          path: |
            combinatorial_bo_results.csv
            combinatorial_bo_benchmark.log
          if-no-files-found: warn
