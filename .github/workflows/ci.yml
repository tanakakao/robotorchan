name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        if: matrix.python-version == '3.11'
        run: ruff check .
      - name: Format check
        if: matrix.python-version == '3.11'
        run: ruff format --check .
      - name: Test core wrappers
        run: >-
          pytest
          --ignore=tests/models/test_fully_bayesian_single_task_gp.py
          --ignore=tests/models/test_fully_bayesian_multi_task_gp.py
          --ignore=tests/models/test_mixed_fully_bayesian.py

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check dist/*
      - name: Inspect wheel contents
        run: |
          unzip -l dist/*.whl | tee /tmp/wheel-contents.txt
          grep -q "robotorchan/__init__.py" /tmp/wheel-contents.txt
          grep -q "robotorchan/models/" /tmp/wheel-contents.txt
          grep -q "robotorchan/py.typed" /tmp/wheel-contents.txt
          grep -q "robotorchan-.*\.dist-info/licenses/LICENSE" /tmp/wheel-contents.txt
      - name: Inspect source distribution contents
        run: |
          tar -tzf dist/*.tar.gz | tee /tmp/sdist-contents.txt
          grep -q "/README.md$" /tmp/sdist-contents.txt
          grep -q "/LICENSE$" /tmp/sdist-contents.txt
          grep -q "/pyproject.toml$" /tmp/sdist-contents.txt
          grep -q "/src/robotorchan/py.typed$" /tmp/sdist-contents.txt
      - name: Create isolated smoke-test environment
        run: python -m venv /tmp/robotorchan-smoke
      - name: Install CPU PyTorch in smoke-test environment
        run: >-
          /tmp/robotorchan-smoke/bin/python -m pip install
          --index-url https://download.pytorch.org/whl/cpu
          "torch>=2.4"
      - name: Install built wheel in smoke-test environment
        run: >-
          /tmp/robotorchan-smoke/bin/python -m pip install
          dist/*.whl
      - name: Smoke test installed package outside repository
        working-directory: /tmp
        run: >-
          /tmp/robotorchan-smoke/bin/python -c
          "import pathlib, robotorchan; from importlib.metadata import version; from robotorchan.models import SingleTaskGP; p = pathlib.Path(robotorchan.__file__).resolve(); assert '/site-packages/' in p.as_posix(), p; assert robotorchan.__version__ == version('robotorchan'); print(p); print(robotorchan.__version__); print(SingleTaskGP)"
      - name: Validate installed distribution metadata
        working-directory: /tmp
        run: >-
          /tmp/robotorchan-smoke/bin/python -c
          "from importlib.metadata import metadata; m = metadata('robotorchan'); assert m['License-File'] == 'LICENSE', m.get_all('License-File'); assert m['Requires-Python'] == '>=3.11', m['Requires-Python']; assert 'License :: OSI Approved :: BSD License' in (m.get_all('Classifier') or []), m.get_all('Classifier'); print(m['Name'], m['Version'], m['Requires-Python'], m['License-File'])"
      - name: Validate PEP 561 marker after installation
        working-directory: /tmp
        run: >-
          /tmp/robotorchan-smoke/bin/python -c
          "import pathlib, robotorchan; marker = pathlib.Path(robotorchan.__file__).with_name('py.typed'); assert marker.is_file(), marker; print(marker)"
      - name: Validate published extras metadata
        working-directory: /tmp
        run: >-
          /tmp/robotorchan-smoke/bin/python -c
          "from importlib.metadata import metadata; extras = set(metadata('robotorchan').get_all('Provides-Extra') or []); expected = {'fully-bayesian', 'examples', 'dev'}; missing = expected - extras; assert not missing, f'missing extras: {sorted(missing)}'; print(sorted(extras))"
      - name: Check dependency consistency
        working-directory: /tmp
        run: /tmp/robotorchan-smoke/bin/python -m pip check
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  notebooks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install notebook dependencies
        run: python -m pip install -e ".[examples]"
      - name: Execute lightweight notebooks
        env:
          MPLBACKEND: Agg
        run: python examples/run_notebooks.py --timeout 300

  fully-bayesian-extra:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install fully Bayesian dependencies
        run: python -m pip install -e ".[dev,fully-bayesian]"
      - name: Optional dependency smoke test
        run: python -c "import jax, numpyro; from robotorchan.models import SaasFullyBayesianSingleTaskGP"
      - name: Fully Bayesian wrapper tests
        run: >-
          pytest
          tests/models/test_fully_bayesian_single_task_gp.py
          tests/models/test_fully_bayesian_multi_task_gp.py
          tests/models/test_mixed_fully_bayesian.py
