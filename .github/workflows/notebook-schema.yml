name: Notebook schema validation

on:
  push:
    paths:
      - '**/*.ipynb'
      - 'scripts/check_notebook_schema.py'
      - '.github/workflows/notebook-schema.yml'
  pull_request:
    paths:
      - '**/*.ipynb'
      - 'scripts/check_notebook_schema.py'
      - '.github/workflows/notebook-schema.yml'

jobs:
  validate-notebooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install nbformat
        run: python -m pip install nbformat==5.10.4
      - name: Validate notebooks
        run: python scripts/check_notebook_schema.py
