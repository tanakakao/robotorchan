name: Empirical noiseless full cohort

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Noiseless single-objective problem
        required: true
        type: choice
        options: [branin, hartmann6]
        default: branin
      q:
        description: Batch size (q=1 and q=3 are separate cohorts)
        required: true
        type: choice
        options: ["1", "3"]
        default: "1"

jobs:
  empirical:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install benchmark package
        run: python -m pip install -e .
      - name: Run frozen ten-seed paired cohort and certify report
        env:
          BENCHMARK_PROBLEM: ${{ inputs.problem }}
          BENCHMARK_Q: ${{ inputs.q }}
          BENCHMARK_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from robotorchan.benchmarks.empirical_noiseless import run_noiseless_singleobjective
          from robotorchan.benchmarks.empirical_report import save_empirical_report

          root = Path("empirical-cohort")
          run_noiseless_singleobjective(
              root,
              problem=os.environ["BENCHMARK_PROBLEM"],
              q=int(os.environ["BENCHMARK_Q"]),
              git_sha=os.environ["BENCHMARK_SHA"],
              dirty=False,
          )
          save_empirical_report(root, root / "report.json")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          assert report["status"] == "complete"
          assert report["seed_count"] == 10
          assert len(report["final_metric_by_seed"]) == 4
          print("Completed paired ten-seed cohort; report saved.")
          PY
      - name: Retain trajectories, manifest, report and failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: empirical-${{ inputs.problem }}-q${{ inputs.q }}-${{ github.run_id }}
          path: empirical-cohort/
          if-no-files-found: warn
          retention-days: 30
