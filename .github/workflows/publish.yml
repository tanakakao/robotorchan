name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          PACKAGE_VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as f:
              data = tomllib.load(f)

          print(data["project"]["version"])
          PY
          )"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          echo "Package version: ${PACKAGE_VERSION}"
          echo "Release tag: ${RELEASE_TAG}"
          if [ "${RELEASE_TAG}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag must be ${EXPECTED_TAG}."
            exit 1
          fi

      - name: Verify release commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "Release tag must point to a commit contained in main."
            exit 1
          fi

      - name: Install build dependencies
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Install built wheel
        run: python -m pip install dist/*.whl

      - name: Verify installed package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          from importlib.metadata import version

          installed_version = version("robotorchan")
          expected_version = os.environ["RELEASE_TAG"].removeprefix("v")
          print(f"Installed version: {installed_version}")
          if installed_version != expected_version:
              raise SystemExit(
                  f"Installed package version {installed_version} does not match "
                  f"release version {expected_version}."
              )
          PY

      - name: Smoke-test installed package
        run: >-
          python -c
          "import robotorchan; from robotorchan.models import SingleTaskGP; print('robotorchan import OK')"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/robotorchan/${{ github.event.release.tag_name }}
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
