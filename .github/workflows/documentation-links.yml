name: Documentation links

on:
  pull_request:
  push:
    branches: [main]

jobs:
  local-markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Test documentation link checker
        run: python -m unittest discover -s tests/docs -p test_docs_links.py
      - name: Check local documentation links
        run: python scripts/check_docs_links.py
      - name: Check notebook Markdown links
        run: python scripts/check_notebook_links.py
      - name: Check reference links and heading anchors
        run: python scripts/check_docs_references.py
      - name: Test theory-implementation mapping consistency
        run: python -m unittest discover -s tests/docs -p test_theory_implementation_mapping.py
      - name: Check theory-implementation mapping consistency
        run: python scripts/check_theory_implementation_mapping.py
      - name: Test fixed theory-guide chapter contract
        run: python -m unittest discover -s tests/docs -p test_theory_guide_quality.py
      - name: Check 48 theory-guide chapter correspondence
        run: python scripts/check_theory_guide_quality.py
      - name: Test documentation inventory and expanded link coverage
        run: python -m unittest discover -s tests/docs -p test_documentation_inventory.py
      - name: Check documentation inventory coverage
        run: python scripts/check_documentation_inventory.py
      - name: Test Theory and Guide ownership boundaries
        run: python -m unittest discover -s tests/docs -p test_documentation_boundaries.py
      - name: Check Theory ownership and Guide source references
        run: python scripts/check_documentation_boundaries.py
