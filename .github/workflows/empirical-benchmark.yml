name: Empirical Benchmark (Manual)

on:
  workflow_dispatch:
    inputs:
      problem:
        description: Benchmark problem
        required: true
        type: choice
        options:
          - branin
          - hartmann6
      q:
        description: Candidate batch size
        required: true
        type: choice
        options:
          - "1"
          - "3"
      seeds:
        description: Smoke (2) or standard baseline (10) seeds
        required: true
        type: choice
        options:
          - "2"
          - "10"

permissions:
  contents: read

jobs:
  empirical-baselines:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4"
      - name: Install robotorchan
        run: python -m pip install -e .
      - name: Execute measured Random/Sobol cohort
        run: >-
          python scripts/run_empirical_baseline_cohort.py
          --problem "${{ inputs.problem }}"
          --q "${{ inputs.q }}"
          --seeds "${{ inputs.seeds }}"
          --git-sha "${{ github.sha }}"
          --output evidence
      - name: Upload measured evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: empirical-${{ inputs.problem }}-q${{ inputs.q }}-s${{ inputs.seeds }}-${{ github.run_id }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 90
