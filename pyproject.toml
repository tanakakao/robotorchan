[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "robotorchan"
version = "0.1.0"
description = "Research-oriented extensions for BoTorch Bayesian optimization and active learning."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "tanakakao" },
]
keywords = [
  "active-learning",
  "bayesian-optimization",
  "botorch",
  "gaussian-process",
  "machine-learning",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "botorch>=0.18.1,<0.19",
]

[project.optional-dependencies]
fully-bayesian = [
  "botorch[fully_bayesian]>=0.18.1,<0.19",
]
examples = [
  "jupyterlab>=4.0",
  "matplotlib>=3.8",
  "nbclient>=0.10",
  "nbformat>=5.10",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.11",
]

[project.urls]
Homepage = "https://github.com/tanakakao/robotorchan"
Documentation = "https://github.com/tanakakao/robotorchan/tree/main/docs"
Repository = "https://github.com/tanakakao/robotorchan"
Issues = "https://github.com/tanakakao/robotorchan/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/robotorchan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["examples/notebooks/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
exclude = ["docs/theory/*.md"]
docstring-code-format = true
